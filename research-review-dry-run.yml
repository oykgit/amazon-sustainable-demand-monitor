name: V1.15 Research review (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * 1-5'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install database driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Run read-only review
        run: python scheduled_review.py --output research_review_report.json
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-review-dry-run
          path: research_review_report.json
          retention-days: 7
