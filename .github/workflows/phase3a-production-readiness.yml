name: Phase 3.0A Production Readiness Evidence
on:
  workflow_dispatch:
    inputs:
      database:
        description: Read-only Neon schema inventory using restricted reader
        type: boolean
        default: true
      oauth:
        description: Optional eBay application token probe (no Browse calls)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_phase3a_readiness.py
      - name: Readiness evidence
        env:
          DB: ${{ inputs.database }}
          OAUTH: ${{ inputs.oauth }}
          DATABASE_READER_URL: ${{ secrets.DATABASE_READER_URL }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          args=()
          if [ "$DB" = true ]; then args+=(--db); fi
          if [ "$OAUTH" = true ]; then args+=(--oauth); fi
          python phase3a_readiness.py "${args[@]}"
