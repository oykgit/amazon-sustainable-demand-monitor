name: Phase 3.0D Product Matching Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-matching:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_phase3d_matching.py tests/test_phase3c_browse.py
      - run: python phase3d_matching.py
