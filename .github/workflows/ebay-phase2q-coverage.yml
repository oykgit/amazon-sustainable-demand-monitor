
name: Phase 2Q eBay Test Coverage Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ""
      EBAY_CLIENT_ID: ""
      EBAY_CLIENT_SECRET: ""
      EBAY_NOTIFICATION_ENDPOINT: ""
      EBAY_VERIFICATION_TOKEN: ""
      EBAY_PHASE2D_AUTH_TEST: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov

      - name: Configure subprocess coverage
        run: |
          cat > .coveragerc <<'EOF'
          [run]
          branch = False
          parallel = True
          source =
              ebay_notification_ledger
              ebay_phase2h
              ebay_phase2i
              ebay_phase2k
              ebay_phase2l
              ebay_phase2m
              ebay_phase2n
              ebay_public_keys
              ebay_signature
              ebay_webhook

          [report]
          show_missing = True
          skip_covered = False
          EOF

          cat > sitecustomize.py <<'EOF'
          import os

          if os.environ.get("COVERAGE_PROCESS_START"):
              try:
                  import coverage
                  coverage.process_startup()
              except ImportError:
                  pass
          EOF

          echo "COVERAGE_PROCESS_START=$GITHUB_WORKSPACE/.coveragerc" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Collect eBay test cases
        run: |
          python -m pytest --collect-only -q tests/test_ebay*.py

      - name: Run tests with coverage
        run: |
          python -m coverage run -m pytest -q tests/test_ebay*.py

      - name: Combine coverage results
        if: always()
        run: |
          python -m coverage combine
          python -m coverage report -m
          python -m coverage xml -o coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebay-phase2q-coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7
