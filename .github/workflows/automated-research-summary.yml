name: Automated research summary (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * *'
permissions:
  contents: read
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Neon driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Produce read-only report
        run: python automated_research_report.py --output automated_research_report.json
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: automated-research-summary
          path: automated_research_report.json
          retention-days: 14
