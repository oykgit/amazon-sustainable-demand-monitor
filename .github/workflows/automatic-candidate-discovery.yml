name: Automated catalogue candidate discovery (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1,4'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Discover public catalogue candidates
        run: python automatic_candidate_discovery.py --output automatic_candidate_discovery.json
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-catalogue-discovery
          path: automatic_candidate_discovery.json
          if-no-files-found: warn
          retention-days: 14
