name: Phase 2T.5 Consolidated Regression Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: storage
            pg_user: storage_test
            pg_db: storage_test
            storage_pg: '1'
            ebay_pg: '0'
          - suite: ebay
            pg_user: ebay_test
            pg_db: ebay_phase2r_test
            storage_pg: '0'
            ebay_pg: '1'
    name: Regression (${{ matrix.suite }})
    env:
      DATABASE_URL: ''
      DATABASE_READER_URL: ''
      DATABASE_INGESTION_URL: ''
      DATABASE_ADMIN_URL: ''
      COMMERCIAL_STORAGE_MODE: legacy
      EBAY_CLIENT_ID: ''
      EBAY_CLIENT_SECRET: ''
      EBAY_NOTIFICATION_ENDPOINT: ''
      EBAY_VERIFICATION_TOKEN: ''
      EBAY_PHASE2D_AUTH_TEST: '0'
      AUTHORIZED_FEED_URL: ''
      AUTHORIZED_FEED_HOST: ''
      AUTHORIZED_FEED_PROVIDER: ''
      AUTHORIZED_FEED_PERMISSION_REF: ''
      BREVO_API_KEY: ''
      PHASE2T3A_LOCAL_PG: ${{ matrix.storage_pg }}
      EBAY_LOCAL_PG_TEST: ${{ matrix.ebay_pg }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ matrix.pg_user }}
          POSTGRES_DB: ${{ matrix.pg_db }}
          POSTGRES_PASSWORD: local_test_only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ${{ matrix.pg_user }} -d ${{ matrix.pg_db }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest psycopg2-binary
      - name: Run commercial and storage suite
        if: matrix.suite == 'storage'
        run: |
          python -m pytest -v -ra --ignore-glob='tests/test_ebay*.py' tests
      - name: Run eBay suite
        if: matrix.suite == 'ebay'
        run: python -m pytest -v -ra tests/test_ebay*.py
