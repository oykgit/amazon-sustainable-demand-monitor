name: Stage 2B commercial intelligence (free data, read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: '45 7 * * *'
permissions:
  contents: read
jobs:
  commercial-assessment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate evidence-gated assessment
        run: python commercial_intelligence.py --output commercial_intelligence_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage-2b-commercial-assessment
          path: commercial_intelligence_report.json
          retention-days: 14
